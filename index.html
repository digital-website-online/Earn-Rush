
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="description"
        content="EarnRush — a fast, simple and exciting mobile game."
    >

    <meta name="theme-color" content="#07111f">

    <title>EarnRush — Play. Rush. Level Up.</title>

    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Animations -->
    <link rel="stylesheet" href="css/animations.css">

    <!-- Responsive Design -->
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <!-- =========================================
         EARNRUSH APP
    ========================================== -->

    <div id="app">

        <header class="game-header">

    <div class="brand">
        <div class="brand-mark">E</div>

        <div class="brand-name">
            EarnRush
        </div>
    </div>

    <div class="header-actions">

        <button class="icon-button" type="button" aria-label="Notifications">
            🔔
        </button>

        <button class="icon-button" type="button" aria-label="Settings">
            ⚙️
        </button>

    </div>

</header>


<section class="player-status">

    <div class="status-card">
        <span class="status-label">Level</span>
        <span class="status-value green">07</span>
    </div>

    <div class="status-card">
        <span class="status-label">Streak</span>
        <span class="status-value gold">🔥 05 Days</span>
    </div>

</section>


<section class="balance-card">

    <span class="balance-label">
        Current Balance
    </span>

    <div class="balance-row">

        <span class="balance-amount" id="balance">
            12,840
        </span>

        <span class="balance-currency">
            R
        </span>

    </div>

    <p class="income-rate">
        Earning rate:
        <strong>+245 / tap</strong>
    </p>

</section>


<section class="reactor-section">

    <span class="reactor-label">
        Cash Reactor
    </span>

    <div class="reactor">

        <button
            class="reactor-core"
            id="reactorCore"
            type="button"
            aria-label="Tap reactor"
        >
            ⚡
        </button>

    </div>


    <div class="combo-area">

        <div class="combo-top">

            <span class="combo-label">
                Combo
            </span>

            <span class="combo-value">
                🔥 x12
            </span>

        </div>

        <div class="progress-track">

            <div class="progress-fill"></div>

        </div>

    </div>


    <button
        class="tap-button"
        id="tapButton"
        type="button"
    >
        TAP TO RUSH ⚡
    </button>

</section>


<section class="quick-actions">

    <button class="quick-card" type="button">

        <span class="quick-icon">🎯</span>

        <span class="quick-title">
            Missions
        </span>

        <span class="quick-subtitle">
            3 available
        </span>

    </button>


    <button class="quick-card" type="button">

        <span class="quick-icon">🏆</span>

        <span class="quick-title">
            Ranking
        </span>

        <span class="quick-subtitle">
            Your position
        </span>

    </button>


    <button class="quick-card" type="button">

        <span class="quick-icon">🎁</span>

        <span class="quick-title">
            Rewards
        </span>

        <span class="quick-subtitle">
            2 unlocked
        </span>

    </button>

</section>
    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script src="js/missions.js"></script>
    <script src="js/rewards.js"></script>
    <script src="js/sharing.js"></script>

</body>
</html>
